<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duelo de Pênaltis</title>
<meta name="description" content="Jogo de pênaltis para dois jogadores no mesmo computador, ou treino contra o computador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap">
<style>
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  /* Flamengo night match: black stand, red and white crowd, green pitch under the lights. */
  --bg:#070707; --card:#121212; --line:#2e2e2e; --fg:#f4f4f4; --muted:#a9a9a9;
  --red:#c8102e; --red-ink:#ff5a66; --white:#ffffff;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,sans-serif;padding-inline:16px;padding-block:20px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
h1{font:400 clamp(26px,6vw,38px)/1.1 Bungee,Impact,sans-serif;margin:0;color:var(--red-ink);text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0}
[hidden]{display:none!important}
label{display:grid;gap:6px;color:var(--muted);font-weight:600;font-size:13px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--red-ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1 1 140px}
button{font:600 15px Inter,system-ui,sans-serif;color:var(--white);background:var(--red);border:0;border-radius:12px;padding:11px 16px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--red);padding:9px 14px}
.or{margin:0;color:var(--muted);text-align:center;font-size:13px}
.msg{margin:0;color:var(--red-ink);min-height:1.4em;font-size:14px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:grid;gap:2px;justify-items:center;text-align:center;min-width:0}
.side.host .nm{color:var(--red-ink)}
.side.guest .nm{color:var(--fg)}
.nm{font-weight:800;text-wrap:balance;overflow-wrap:anywhere}
.pts{font:400 44px/1 Bungee,Impact,sans-serif}
.rnd{font-size:13px;color:var(--muted);text-align:center}
svg{width:100%;height:auto;display:block;border-radius:14px}
/* Transforms are written in the SVG's own coordinates, so pin the origin there. */
#keeper,#ball{transform-box:view-box;transform-origin:0 0;transition:transform .68s cubic-bezier(.2,.8,.2,1)}
#keeper.instant,#ball.instant{transition:none}
@media (prefers-reduced-motion:reduce){#keeper,#ball{transition:none}}
.zone{fill:transparent;stroke:none}
.zone.hit{fill:rgba(200,16,46,.3);stroke:var(--red-ink);stroke-width:3}
.banner{margin:0;min-height:1.5em;font:400 22px/1.2 Bungee,Impact,sans-serif;text-align:center;color:var(--red-ink);text-wrap:balance}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zones button{padding:12px 6px;font-size:14px}
.hint{margin:0;text-align:center;font-weight:600;text-wrap:balance}
.again{display:flex;justify-content:center}
#play{display:grid;gap:12px}
.handoff{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:34px}
.handoff p{margin:0;font:400 20px/1.3 Bungee,Impact,sans-serif;color:var(--red-ink);text-wrap:balance}
.handoff small{color:var(--muted);font-size:14px;max-width:34ch;text-wrap:balance}
.code{margin:0;text-align:center;color:var(--muted);font-size:13px}
.code strong{color:var(--red-ink);letter-spacing:.12em}</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Duelo de Pênaltis</h1>
    <p class="sub" id="sub">Dez cobranças. Quem faz mais gols vence.</p>
  </header>

  <section class="card" id="lobby">
    <label>Nome do 1º jogador
      <input id="name1" maxlength="20" placeholder="Ex.: Rubens">
    </label>
    <label>Nome do 2º jogador
      <input id="name2" maxlength="20" placeholder="Ex.: Mel">
    </label>
    <div class="row">
      <button id="local">Jogar os dois</button>
      <button id="train" class="ghost">Treinar contra o computador</button>
    </div>
    <p class="or">Os dois jogam no mesmo computador, revezando a vez.</p>
  </section>

  <section class="card" id="game" hidden>
    <div class="board">
      <div class="side host"><span class="nm" id="nHost"></span><span class="pts" id="pHost">0</span></div>
      <div class="rnd" id="rnd"></div>
      <div class="side guest"><span class="nm" id="nGuest"></span><span class="pts" id="pGuest">0</span></div>
    </div>

    <div id="play">
    <svg id="field" viewBox="0 0 600 470" role="img" aria-label="Estádio à noite: torcida na arquibancada, gramado e o gol dividido em seis cantos">
      <defs>
        <!-- Crowd: irregular heads so it reads as people, not as a pattern. -->
        <pattern id="crowdFar" width="26" height="20" patternUnits="userSpaceOnUse">
          <rect width="26" height="20" fill="#120d0e"/>
          <circle cx="4" cy="4" r="2.6" fill="#6f0f1d"/>
          <circle cx="13" cy="6" r="2.2" fill="#8a8a8a"/>
          <circle cx="21" cy="3" r="2.5" fill="#232323"/>
          <circle cx="26" cy="11" r="2.1" fill="#7d1020"/>
          <circle cx="16" cy="13" r="2.7" fill="#9a9a9a"/>
          <circle cx="8" cy="15" r="2.3" fill="#6f0f1d"/>
          <circle cx="0" cy="11" r="2.4" fill="#8f7560"/>
          <circle cx="23" cy="18" r="2.2" fill="#a3a3a3"/>
        </pattern>
        <pattern id="crowdNear" width="34" height="26" patternUnits="userSpaceOnUse">
          <rect width="34" height="26" fill="#17110f"/>
          <circle cx="5" cy="5" r="3.8" fill="#c8102e"/>
          <circle cx="16" cy="7" r="3.2" fill="#e4e4e4"/>
          <circle cx="27" cy="4" r="3.6" fill="#2a2a2a"/>
          <circle cx="34" cy="12" r="3" fill="#a60f24"/>
          <circle cx="21" cy="16" r="3.9" fill="#d2d2d2"/>
          <circle cx="10" cy="18" r="3.3" fill="#c8102e"/>
          <circle cx="0" cy="13" r="3.4" fill="#c2a183"/>
          <circle cx="29" cy="22" r="3.1" fill="#ebebeb"/>
          <circle cx="15" cy="25" r="3.5" fill="#8d1226"/>
          <circle cx="3" cy="24" r="3" fill="#343434"/>
        </pattern>
        <pattern id="boards" width="120" height="22" patternUnits="userSpaceOnUse">
          <rect width="120" height="22" fill="#a90e27"/>
          <rect x="60" width="60" height="22" fill="#121212"/>
          <rect width="120" height="2" fill="rgba(255,255,255,.28)"/>
        </pattern>
        <linearGradient id="lights" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <pattern id="net" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M0 0H16M0 0V16" stroke="rgba(255,255,255,.26)" stroke-width="1" fill="none"/>
        </pattern>
      </defs>

      <!-- The stand behind the goal -->
      <rect x="0" y="0" width="600" height="470" fill="#0a0a0b"/>
      <rect x="0" y="26" width="600" height="82" fill="url(#crowdFar)"/>
      <rect x="0" y="108" width="600" height="5" fill="#0c0c0c"/>
      <rect x="0" y="113" width="600" height="125" fill="url(#crowdNear)"/>
      <rect x="0" y="0" width="600" height="190" fill="url(#lights)"/>
      <g fill="#fff">
        <circle cx="58" cy="54" r="2.4" opacity=".9"/>
        <circle cx="206" cy="38" r="2" opacity=".75"/>
        <circle cx="352" cy="66" r="2.4" opacity=".85"/>
        <circle cx="474" cy="42" r="2" opacity=".7"/>
        <circle cx="540" cy="78" r="2.4" opacity=".8"/>
        <circle cx="128" cy="150" r="2.2" opacity=".75"/>
        <circle cx="286" cy="188" r="2.2" opacity=".6"/>
        <circle cx="430" cy="162" r="2.2" opacity=".7"/>
      </g>
      <g stroke="#242424" stroke-width="2">
        <path d="M62 212 V178"/><path d="M304 222 V188"/><path d="M548 210 V176"/>
      </g>
      <path d="M62 178 h22 l-4 6 4 6 h-22 z" fill="#c8102e"/>
      <path d="M304 188 h20 l-4 6 4 6 h-20 z" fill="#ededed"/>
      <path d="M548 176 h22 l-4 6 4 6 h-22 z" fill="#c8102e"/>
      <rect x="0" y="238" width="600" height="22" fill="url(#boards)"/>

      <!-- The pitch: mown bands, wider as they come toward the penalty spot -->
      <g>
        <rect x="0" y="260" width="600" height="8" fill="#2d8445"/>
        <rect x="0" y="268" width="600" height="11" fill="#246f39"/>
        <rect x="0" y="279" width="600" height="14" fill="#2d8445"/>
        <rect x="0" y="293" width="600" height="18" fill="#246f39"/>
        <rect x="0" y="311" width="600" height="22" fill="#2d8445"/>
        <rect x="0" y="333" width="600" height="26" fill="#246f39"/>
        <rect x="0" y="359" width="600" height="31" fill="#2d8445"/>
        <rect x="0" y="390" width="600" height="36" fill="#246f39"/>
        <rect x="0" y="426" width="600" height="44" fill="#2d8445"/>
      </g>
      <g fill="none" stroke="#f2f6f2" stroke-width="3" opacity=".9">
        <line x1="0" y1="310" x2="600" y2="310"/>
        <path d="M115 311 L68 372 H532 L485 311"/>
      </g>
      <circle cx="300" cy="420" r="4" fill="#f2f6f2"/>

      <!-- The goal -->
      <rect x="90" y="120" width="420" height="190" fill="url(#net)"/>
      <!-- The six cantos, drawn faintly so both players can see them. -->
      <g stroke="rgba(255,255,255,.22)" stroke-width="1.5" stroke-dasharray="7 6">
        <line x1="230" y1="120" x2="230" y2="310"/>
        <line x1="370" y1="120" x2="370" y2="310"/>
        <line x1="90" y1="215" x2="510" y2="215"/>
      </g>
      <path d="M90 310 V120 H510 V310" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
      <rect class="zone" id="z-LA" x="90" y="120" width="140" height="95"/>
      <rect class="zone" id="z-CA" x="230" y="120" width="140" height="95"/>
      <rect class="zone" id="z-RA" x="370" y="120" width="140" height="95"/>
      <rect class="zone" id="z-LB" x="90" y="215" width="140" height="95"/>
      <rect class="zone" id="z-CB" x="230" y="215" width="140" height="95"/>
      <rect class="zone" id="z-RB" x="370" y="215" width="140" height="95"/>

      <!-- Goalkeeper, drawn around his own centre so a dive is a rotation about it. -->
      <g id="keeper">
        <g id="armsUp">
          <path d="M-19 -40 L-37 -74" stroke="#c8102e" stroke-width="11" stroke-linecap="round"/>
          <path d="M19 -40 L37 -74" stroke="#c8102e" stroke-width="11" stroke-linecap="round"/>
          <circle cx="-39" cy="-78" r="8" fill="#fff" stroke="#111" stroke-width="1"/>
          <circle cx="39" cy="-78" r="8" fill="#fff" stroke="#111" stroke-width="1"/>
        </g>
        <g id="armsDown" hidden>
          <path d="M-19 -40 L-33 -4" stroke="#c8102e" stroke-width="11" stroke-linecap="round"/>
          <path d="M19 -40 L33 -4" stroke="#c8102e" stroke-width="11" stroke-linecap="round"/>
          <circle cx="-34" cy="0" r="8" fill="#fff" stroke="#111" stroke-width="1"/>
          <circle cx="34" cy="0" r="8" fill="#fff" stroke="#111" stroke-width="1"/>
        </g>
        <rect x="-16" y="26" width="12" height="46" rx="5" fill="#0a0a0a" stroke="#fff" stroke-width="1"/>
        <rect x="4" y="26" width="12" height="46" rx="5" fill="#0a0a0a" stroke="#fff" stroke-width="1"/>
        <path d="M-16 72 h-9 a4 4 0 0 0 0 8 h13 z" fill="#141414" stroke="#fff" stroke-width=".8"/>
        <path d="M16 72 h9 a4 4 0 0 1 0 8 h-13 z" fill="#141414" stroke="#fff" stroke-width=".8"/>
        <rect x="-18" y="4" width="36" height="24" rx="5" fill="#0a0a0a" stroke="#fff" stroke-width="1"/>
        <path d="M-20 6 C-22 -24 -18 -40 0 -45 C18 -40 22 -24 20 6 Z" fill="#c8102e" stroke="#fff" stroke-width="1.5"/>
        <text x="0" y="-16" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" font-family="Inter,sans-serif">1</text>
        <circle cx="0" cy="-58" r="13" fill="#e0b48a" stroke="#fff" stroke-width="1"/>
        <path d="M-13.5 -59 Q-13 -73 0 -73 Q13 -73 13.5 -59 Q6 -67 0 -67 Q-6 -67 -13.5 -59 Z" fill="#141414"/>
      </g>

      <!-- Striker, nearer the camera: larger, feet on the grass by the penalty spot. -->
      <g id="kicker" transform="translate(368,468) scale(1.22)">
        <rect x="2" y="-52" width="11" height="48" rx="5" fill="#e0b48a"/>
        <rect x="2" y="-14" width="11" height="14" rx="3" fill="#fff" stroke="#111" stroke-width=".8"/>
        <g id="legStand">
          <rect x="-13" y="-52" width="11" height="48" rx="5" fill="#e0b48a"/>
          <rect x="-13" y="-14" width="11" height="14" rx="3" fill="#fff" stroke="#111" stroke-width=".8"/>
        </g>
        <g id="legKick" hidden>
          <path d="M-7 -52 L-34 -32" stroke="#e0b48a" stroke-width="11" stroke-linecap="round"/>
          <rect x="-45" y="-38" width="16" height="11" rx="3" fill="#fff" stroke="#111" stroke-width=".8"/>
        </g>
        <rect x="-15" y="-74" width="30" height="24" rx="5" fill="#fff" stroke="#111" stroke-width="1"/>
        <path d="M-15 -104 L-31 -84" stroke="#e0b48a" stroke-width="9" stroke-linecap="round"/>
        <path d="M15 -104 L31 -84" stroke="#e0b48a" stroke-width="9" stroke-linecap="round"/>
        <path d="M-16 -72 C-18 -100 -14 -114 0 -118 C14 -114 18 -100 16 -72 Z" fill="#fff" stroke="#111" stroke-width="1.2"/>
        <text x="0" y="-90" text-anchor="middle" font-size="14" font-weight="800" fill="#111" font-family="Inter,sans-serif">10</text>
        <circle cx="0" cy="-131" r="13" fill="#e0b48a" stroke="#fff" stroke-width="1"/>
        <path d="M-13.5 -132 Q-13 -146 0 -146 Q13 -146 13.5 -132 Q6 -140 0 -140 Q-6 -140 -13.5 -132 Z" fill="#141414"/>
      </g>

      <circle id="aim" cx="300" cy="215" r="10" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 3" opacity="0"/>
      <g id="ball"><circle r="12" fill="#fff" stroke="#222" stroke-width="2"/></g>
    </svg>

    <p class="banner" id="banner"></p>
    <p class="hint" id="hint"></p>
    <div class="again" id="againRow" hidden><button id="again">Jogar de novo</button></div>
    <div class="zones">
      <button data-z="LA">&#8598; Alto esq.</button>
      <button data-z="CA">&#8593; Alto meio</button>
      <button data-z="RA">&#8599; Alto dir.</button>
      <button data-z="LB">&#8601; Baixo esq.</button>
      <button data-z="CB">&#8595; Baixo meio</button>
      <button data-z="RB">&#8600; Baixo dir.</button>
    </div>
    </div>

    <div class="handoff" id="handoff" hidden>
      <p id="handoffWho"></p>
      <small id="handoffNote"></small>
      <button id="handoffGo">Estou pronto</button>
    </div>

    <p class="code"><button class="ghost" id="leave">Voltar ao in&iacute;cio</button></p>
  </section>
</main>
<script>
// Duelo de Penaltis - jogo completo, sem servidor. Tudo roda no navegador.
const TOTAL = 10;
const VB = { w: 600, h: 470 };
const GOAL = { x1: 90, x2: 510, y1: 120, y2: 310, mx1: 230, mx2: 370, my: 215 };
const SPOT = { x: 300, y: 420 };
const ZC = {
  LA: { x: 160, y: 170 }, CA: { x: 300, y: 170 }, RA: { x: 440, y: 170 },
  LB: { x: 160, y: 260 }, CB: { x: 300, y: 260 }, RB: { x: 440, y: 260 }
};
const KPOS = {
  LA: 'translate(175px,168px) rotate(-85deg)',
  CA: 'translate(300px,190px)',
  RA: 'translate(425px,168px) rotate(85deg)',
  LB: 'translate(175px,262px) rotate(-85deg)',
  CB: 'translate(300px,262px) scale(1,0.62)',
  RB: 'translate(425px,262px) rotate(85deg)'
};
const KREST = 'translate(300px,230px)';
const ARMS_DOWN = { CB: true };
const $ = id => document.getElementById(id);

let mode = null;            // 'local' = os dois no mesmo PC | 'train' = contra o computador
let room = null;
let busy = false, resolving = false, shown = -1, aimMode = false, animating = false;
let cpuTimer = null, timers = [], ready = null;

// SVG nao tem a propriedade `hidden`, entao mexemos no atributo.
function show(el, on){ if (on) el.removeAttribute('hidden'); else el.setAttribute('hidden',''); }
function rnd(){ const k = Object.keys(ZC); return k[Math.floor(Math.random()*k.length)]; }
function zoneOf(x, y){
  return (x < GOAL.mx1 ? 'L' : x < GOAL.mx2 ? 'C' : 'R') + (y < GOAL.my ? 'A' : 'B');
}
function kickerIsHost(){ return room.round % 2 === 1; }

// De quem e a vez nesta tela.
function need(){
  if (!room || room.status === 'over') return null;
  if (mode === 'local') return !room.kick ? 'kick' : (!room.keep ? 'keep' : null);
  if (kickerIsHost()) return !room.kick ? 'kick' : null;      // treino: voce cobra
  return (room.kick && !room.keep) ? 'keep' : null;           // treino: voce defende
}
function store(patch){ room = Object.assign({}, room, patch); render(); }

function start(m){
  clearTimers();
  if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; }
  mode = m; ready = null; animating = false; shown = -1;
  const n1 = $('name1').value.trim().slice(0,20) || 'Jogador 1';
  const n2 = $('name2').value.trim().slice(0,20) || 'Jogador 2';
  room = {
    hostName: n1, guestName: m === 'train' ? 'Computador' : n2,
    status: 'playing', round: 1, kick: null, keep: null,
    score: { host: 0, guest: 0 }, last: null
  };
  render();
}

function pickAt(x, y){
  if (busy || !room || room.status === 'over') return;
  busy = true;
  const px = Math.min(GOAL.x2 - 6, Math.max(GOAL.x1 + 6, x));
  const py = Math.min(GOAL.y2 - 6, Math.max(GOAL.y1 + 6, y));
  const n = need();
  if (n === 'kick') store({ kick: { z: zoneOf(px, py), x: px, y: py } });
  else if (n === 'keep') store({ keep: zoneOf(px, py) });
  busy = false;
}

// No treino o computador joga o outro lado.
function trainTick(){
  if (mode !== 'train' || !room || resolving || cpuTimer || room.status === 'over') return;
  if (room.kick && room.keep) { resolve(); return; }
  const meKicks = kickerIsHost();
  if ((!room.kick && !meKicks) || (room.kick && !room.keep && meKicks)) {
    cpuTimer = setTimeout(cpuMove, 900);
  }
}
function cpuShot(){
  const z = rnd(), c = ZC[z];
  return { z, x: c.x + (Math.random()-0.5)*90, y: c.y + (Math.random()-0.5)*55 };
}
function cpuMove(){
  cpuTimer = null;
  if (mode !== 'train' || !room || resolving || room.status === 'over') return;
  const meKicks = kickerIsHost();
  if (!room.kick && !meKicks) store({ kick: cpuShot() });
  else if (room.kick && !room.keep && meKicks) store({ keep: rnd() });
}

function resolve(){
  if (resolving || !room || !room.kick || !room.keep) return;
  resolving = true;
  const r = room;
  const score = { host: r.score.host, guest: r.score.guest };
  const goal = r.kick.z !== r.keep;
  if (goal) { if (r.round % 2 === 1) score.host++; else score.guest++; }
  const last = { round: r.round, kick: r.kick, keep: r.keep, goal };
  const over = r.round >= TOTAL;
  if (mode === 'local') animating = true;   // segura a tela de troca ate o chute terminar
  store({ score, last, kick: null, keep: null, round: r.round + 1, status: over ? 'over' : 'playing' });
  resolving = false;
  if (mode === 'train') trainTick();
}

function restart(){
  if (!room || room.status !== 'over') return;
  clearTimers();
  if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; }
  shown = -1; animating = false; ready = null;
  store({ status: 'playing', round: 1, kick: null, keep: null,
          score: { host: 0, guest: 0 }, last: null });
}

function finalText(){
  const h = room.score.host, g = room.score.guest;
  if (h === g) return 'Empate em ' + h + ' a ' + g + '!';
  const w = h > g ? room.hostName : room.guestName;
  return (w || 'Vencedor') + ' venceu por ' + Math.max(h,g) + ' a ' + Math.min(h,g) + '!';
}

// --- o campo ---------------------------------------------------------------
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function move(el, t, instant){
  if (instant) el.classList.add('instant');
  el.style.transform = t;
  if (instant) { void el.getBoundingClientRect(); el.classList.remove('instant'); }
}
function keeperArms(z){
  const down = !z || !!ARMS_DOWN[z];
  show($('armsDown'), down); show($('armsUp'), !down);
}
function clearHighlight(){ document.querySelectorAll('.zone').forEach(z => z.classList.remove('hit')); }
function resetField(instant){
  move($('keeper'), KREST, instant);
  move($('ball'), 'translate(' + SPOT.x + 'px,' + SPOT.y + 'px)', instant);
  keeperArms(null);
  show($('legKick'), false); show($('legStand'), true);
}
function shootField(last){
  move($('keeper'), KPOS[last.keep], false);
  keeperArms(last.keep);
  show($('legStand'), false); show($('legKick'), true);
  const t = last.goal ? { x: last.kick.x, y: last.kick.y } : ZC[last.keep];
  move($('ball'), 'translate(' + t.x + 'px,' + t.y + 'px)', false);
}
function renderField(){
  const last = room.last;
  if (!last) {
    clearTimers(); clearHighlight(); resetField(true);
    animating = false; $('banner').textContent = ''; shown = 0; return;
  }
  const fresh = last.round !== shown && shown !== -1;
  shown = last.round;
  $('banner').textContent = last.goal ? 'GOL!' : 'DEFENDEU!';
  if (!fresh) { clearTimers(); clearHighlight(); resetField(true); animating = false; return; }
  clearTimers(); clearHighlight(); resetField(true);
  animating = true;
  $('z-' + last.kick.z).classList.add('hit');
  later(function(){ shootField(last); }, 70);
  later(function(){
    clearHighlight(); resetField(false); animating = false;
    if (mode === 'local') render();
  }, 2100);
}

function render(){
  $('lobby').hidden = !!mode;
  $('game').hidden = !mode;
  if (!mode || !room) { $('sub').textContent = 'Dez cobranças. Quem faz mais gols vence.'; return; }
  $('sub').textContent = mode === 'train' ? 'Treino contra o computador' : 'Os dois no mesmo computador';
  $('nHost').textContent = room.hostName;
  $('nGuest').textContent = room.guestName;
  $('pHost').textContent = room.score.host;
  $('pGuest').textContent = room.score.guest;

  const over = room.status === 'over';
  $('rnd').textContent = over ? 'Fim de jogo' : 'Cobrança ' + room.round + ' de ' + TOTAL;

  const kickerName = kickerIsHost() ? room.hostName : room.guestName;
  const keeperName = kickerIsHost() ? room.guestName : room.hostName;
  const n = need();
  let enabled = false, hint = '', handoff = null;

  if (over) hint = finalText();
  else if (mode === 'local') {
    if (n === 'kick') { enabled = true; hint = 'Vez de ' + kickerName + ': clique no gol onde quer chutar.'; }
    else if (n === 'keep') { enabled = true; hint = 'Vez de ' + keeperName + ': clique para onde vai pular.'; }
    if (n && ready !== n && !animating) handoff = n;
  } else {
    if (n === 'kick') { enabled = true; hint = 'Clique no gol onde quer chutar: alto ou embaixo, no canto que quiser.'; }
    else if (n === 'keep') { enabled = true; hint = 'Chute feito! Clique para onde você vai pular.'; }
    else if (!room.kick) hint = 'O computador vai cobrar...';
    else hint = 'Aguardando o resultado...';
  }

  show($('handoff'), !!handoff);
  $('handoff').hidden = !handoff;
  $('play').hidden = !!handoff;
  if (handoff) {
    const who = handoff === 'kick' ? kickerName : keeperName;
    const other = handoff === 'kick' ? keeperName : kickerName;
    $('handoffWho').textContent = 'Passe o computador para ' + who;
    $('handoffNote').textContent = other + ', não olhe: ' + who + ' vai escolher '
      + (handoff === 'kick' ? 'o canto do chute.' : 'o canto do pulo.');
  }

  $('againRow').hidden = !over;
  aimMode = enabled;
  $('field').style.cursor = enabled ? 'crosshair' : 'default';
  $('aim').setAttribute('opacity', 0);
  $('hint').textContent = hint;
  document.querySelectorAll('.zones button').forEach(function(b){ b.disabled = !enabled; });
  renderField();
  if (mode === 'train') trainTick();
  else if (mode === 'local' && room.kick && room.keep) resolve();
}

// --- mira com o mouse -------------------------------------------------------
const field = $('field');
function svgPoint(e){
  const r = field.getBoundingClientRect();
  return { x: (e.clientX - r.left)/r.width*VB.w, y: (e.clientY - r.top)/r.height*VB.h };
}
function inGoal(p){
  return p.x >= GOAL.x1+2 && p.x <= GOAL.x2-2 && p.y >= GOAL.y1+2 && p.y <= GOAL.y2-2;
}
field.addEventListener('mousemove', function(e){
  const aim = $('aim');
  if (!aimMode) { aim.setAttribute('opacity', 0); return; }
  const p = svgPoint(e);
  if (!inGoal(p)) { aim.setAttribute('opacity', 0); return; }
  aim.setAttribute('cx', p.x); aim.setAttribute('cy', p.y); aim.setAttribute('opacity', 1);
});
field.addEventListener('mouseleave', function(){ $('aim').setAttribute('opacity', 0); });
field.addEventListener('click', function(e){
  const p = svgPoint(e);
  if (inGoal(p)) pickAt(p.x, p.y);
});
// Dedo na tela funciona igual ao mouse.
field.addEventListener('touchend', function(e){
  if (!aimMode || !e.changedTouches.length) return;
  const t = e.changedTouches[0];
  const p = svgPoint({ clientX: t.clientX, clientY: t.clientY });
  if (inGoal(p)) { e.preventDefault(); pickAt(p.x, p.y); }
}, { passive: false });

$('local').onclick = function(){ start('local'); };
$('train').onclick = function(){ start('train'); };
$('again').onclick = restart;
$('handoffGo').onclick = function(){ ready = need(); render(); };
$('leave').onclick = function(){
  clearTimers();
  if (cpuTimer) { clearTimeout(cpuTimer); cpuTimer = null; }
  mode = null; room = null; ready = null; animating = false;
  render();
};
document.querySelectorAll('.zones button').forEach(function(b){
  b.onclick = function(){ const c = ZC[b.dataset.z]; pickAt(c.x, c.y); };
});

resetField(true);
render();

</script>
</body>
</html>
